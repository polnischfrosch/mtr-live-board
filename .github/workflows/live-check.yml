name: Live API check

# Asks the MTR Next Train API for real data with tools/mtr_live_test.py and keeps the debug file.
# Runs on every push to main, every day at 07:17 UTC (15:17 in Hong Kong)
# and by hand (Actions -> Live API check -> Run workflow). A failure here does not block the page:
# the service may be down or may refuse GitHub's servers.
on:
  push:
    branches: [main]
  schedule:
    - cron: "17 7 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run live test (every line)
        run: python3 tools/mtr_live_test.py --all --debug | tee live_test_output.txt
      - name: Summary
        if: always()
        run: |
          f=$(ls tools/mtr_live_test_debug_*.json | head -1)
          python3 - "$f" >> "$GITHUB_STEP_SUMMARY" <<'PY'
          import json, sys
          d = json.load(open(sys.argv[1]))
          s = d["summary"]
          print(f"### Live API check\n\n{s['ok']} of {s['requests']} requests answered.\n")
          print(f"- new connection {s.get('avg_ms_new_connection')} ms, reused {s.get('avg_ms_reused_connection')} ms, HTTP 429: {s.get('http_429')}")
          for e in s["errors"]:
              print(f"- error: `{e}`")
          PY
          if grep -q '"ok": 0,' "$f"; then exit 1; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: live-test-debug
          path: |
            tools/mtr_live_test_debug_*.json
            live_test_output.txt
          retention-days: 14
